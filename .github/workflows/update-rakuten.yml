name: Update Rakuten Products

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: write

jobs:
  update-products:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

    

      - name: Fetch Rakuten products
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/update_products.py

      - name: Commit updated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.json

          if git diff --cached --quiet; then
            echo "No product changes."
          else
            git commit -m "chore: update Rakuten products"
            git push
          fi
