<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="日本生活の便利グッズを紹介するアフィリエイトサイト">
  <title>暮らし便利帳｜日本生活の便利グッズ</title>
  <style>
    :root{--bg:#f7f7f8;--card:#fff;--text:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#e60012;--accent2:#fff1f2}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    a{color:inherit}.wrap{max-width:1100px;margin:auto;padding:0 20px}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-weight:900;font-size:21px}.brand span{color:var(--accent)}
    nav{display:flex;gap:18px;font-size:14px} nav a{text-decoration:none}
    .hero{padding:58px 0 40px;background:linear-gradient(135deg,#fff,#fff5f5)}
    .eyebrow{color:var(--accent);font-weight:800;font-size:13px}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.12;margin:10px 0 16px;letter-spacing:-.04em}
    .hero p{max-width:650px;color:#52525b;line-height:1.8;margin:0}
    .tools{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.search{flex:1;min-width:230px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
    .btn{border:0;border-radius:10px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;transition:opacity .2s ease}
.btn:hover{opacity:.85}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
    main{padding:36px 0 70px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.section-head h2{margin:0;font-size:25px}.section-head p{margin:0;color:var(--muted);font-size:13px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap;flex:0 0 auto}.chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
    .thumb{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;color:#71717a;font-weight:800;padding:12px}
.thumb img{transition:transform .25s ease}
.card:hover .thumb img{transform:scale(1.04)}
    .body{padding:18px}.tag{font-size:11px;color:var(--accent);font-weight:800}.card h3{font-size:18px;margin:7px 0}.card p{font-size:14px;line-height:1.65;color:#52525b;margin:0 0 16px}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:900}.affiliate{font-size:11px;color:var(--muted);margin-top:10px}
    .empty{display:none;padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
    .note{margin-top:36px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;color:#52525b;font-size:13px;line-height:1.7}
    footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:12px;background:#fff}
    @media(max-width:800px){
  .wrap{padding:0 16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  nav{display:none}
  .hero{padding:42px 0 30px}
  .hero h1{font-size:38px}
  .hero p{font-size:14px;line-height:1.7}
  .tools{gap:8px}
  .search{min-width:0;width:100%;font-size:16px}
  .btn{min-height:44px}
  .filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}
  .chip{white-space:nowrap}
  .body{padding:14px}
  .card h3{font-size:16px}
  .card p{font-size:13px}
}

@media(max-width:540px){
  .wrap{padding:0 14px}
  .nav{height:60px}
  .brand{font-size:19px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .hero{padding:34px 0 26px}
  .hero h1{font-size:32px}
  .tools{display:flex;flex-direction:column}
  .search{width:100%}
  .tools .btn{width:100%}
  .thumb{aspect-ratio:1/1;padding:8px}
  .body{padding:12px}
  .card h3{font-size:14px;line-height:1.4}
  .card p{font-size:12px;line-height:1.5}
  .meta{align-items:flex-start;flex-direction:column}
  .meta .btn{width:100%;text-align:center}
  .price{font-size:14px}
  .affiliate{font-size:10px}
}
  </style>
</head>
<body>
<header><div class="wrap nav">
  <div class="brand">暮らし<span>便利帳</span></div>
  <nav><a href="#products">おすすめ</a><a href="#about">このサイトについて</a></nav>
</div></header>

<section class="hero"><div class="wrap">
  <div class="eyebrow">暮らし便利帳｜JAPAN LIFE</div>
  <h1>暮らしを、もっと<br>便利に。</h1>
  <p>日本での一人暮らし・学生生活・日常生活を、もっと快適にする便利グッズを紹介します。</p>
  <div class="tools">
    <input id="search" class="search" type="search" placeholder="商品名・用途・カテゴリから探す…">
    <button id="clear" class="btn secondary" type="button">検索をリセット</button>
  </div>
</div></section>

<main id="products"><div class="wrap">
  <div class="section-head"><div><h2>おすすめアイテム</h2><p id="count"></p></div></div>
  <div id="filters" class="filters"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">条件に合う商品がありません。</div>
  <div id="about" class="note">
    <strong>サイトについて</strong><br>
    このサイトでは、日常生活で便利な商品やサービスを紹介しています。商品情報・価格・在庫などは購入前に販売ページでご確認ください。
    <br><br><strong>PR</strong>：当サイトにはアフィリエイト広告が含まれる場合があります。
  </div>
</div></main>

<footer><div class="wrap">© 2026 暮らし便利帳</div></footer>

<script>
let products = [];
const fallbackProducts = [
  {id:"fallback-1",cat:"一人暮らし",title:"省スペース収納グッズ",desc:"狭い部屋でも使いやすい収納アイテム。",price:"商品ページで確認",url:"#",image:""},
  {id:"fallback-2",cat:"キッチン",title:"キッチン便利グッズ",desc:"料理や後片付けの手間を減らす便利アイテム。",price:"商品ページで確認",url:"#",image:""},
  {id:"fallback-3",cat:"掃除",title:"掃除・整理グッズ",desc:"毎日の掃除を少しラクにするアイテム。",price:"商品ページで確認",url:"#",image:""},
  {id:"fallback-4",cat:"学生生活",title:"学生生活の便利グッズ",desc:"学校・勉強・通学で使いやすいアイテム。",price:"商品ページで確認",url:"#",image:""},
  {id:"fallback-5",cat:"PC・デスク",title:"デスク周り便利グッズ",desc:"PC作業や勉強環境を快適にするアイテム。",price:"商品ページで確認",url:"#",image:""},
  {id:"fallback-6",cat:"旅行",title:"旅行・出張便利グッズ",desc:"荷物を整理して移動をラクにするアイテム。",price:"商品ページで確認",url:"#",image:""}
];

const state={cat:"すべて",q:""};
const filters=document.querySelector("#filters"),grid=document.querySelector("#grid"),empty=document.querySelector("#empty"),count=document.querySelector("#count"),search=document.querySelector("#search");

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderFilters(){
  const cats=["すべて",...new Set(products.map(p=>p.cat).filter(Boolean))];
  if(!cats.includes(state.cat)) state.cat="すべて";
  filters.innerHTML="";
  cats.forEach(cat=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"+(state.cat===cat?" active":""); b.textContent=cat;
    b.addEventListener("click",()=>{state.cat=cat;renderFilters();render()});
    filters.appendChild(b);
  });
}

function render(){
  const q=state.q.trim().toLowerCase();
  const list=products.filter(p=>
    (state.cat==="すべて"||p.cat===state.cat) &&
    (!q||(p.title+" "+p.desc+" "+p.cat).toLowerCase().includes(q))
  );
  grid.innerHTML="";
  count.textContent=`${list.length}件`;
  empty.style.display=list.length?"none":"block";

  list.forEach(p=>{
    const card=document.createElement("article");
    card.className="card";
    const image = p.image
      ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}" style="width:100%;height:100%;object-fit:contain;" loading="lazy" decoding="async" loading="lazy">`
      : "IMAGE";
    const button = p.url && p.url !== "#"
      ? `<a class="btn" href="${escapeHtml(p.url)}" target="_blank" rel="nofollow sponsored noopener">楽天で見る</a>`
      : `<span class="btn secondary">準備中</span>`;
    card.innerHTML=`<div class="thumb">${image}</div>
      <div class="body"><div class="tag">${escapeHtml(p.cat)}</div>
      <h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.desc)}</p>
      <div class="meta"><span class="price">${escapeHtml(p.price)}</span>${button}</div>
      <div class="affiliate">PR / アフィリエイトリンク</div></div>`;
    grid.appendChild(card);
  });
}

async function loadProducts(){
  try{
    const res=await fetch("./products.json?ts="+Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("products.json: "+res.status);
    const data=await res.json();
    products=Array.isArray(data.products) ? data.products : [];
    if(!products.length) products=fallbackProducts;
  }catch(e){
    console.warn("商品データを読み込めませんでした。", e);
    products=fallbackProducts;
  }
  renderFilters();
  render();
}

search.addEventListener("input",e=>{state.q=e.target.value;render()});
document.querySelector("#clear").addEventListener("click",()=>{search.value="";state.q="";render()});
loadProducts();
</script>
</body>
</html>
